site_name: kanx
site_description: Production-grade Kolmogorov-Arnold Networks (TensorFlow + PyTorch + ONNX)
site_url: https://mattral.github.io/KANX/
repo_url: https://github.com/Mattral/KANX
repo_name: Mattral/KANX
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: "#"
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Concepts:
      - Philosophy: philosophy.md
      - Architecture: architecture.md
      - System Design: system_design.md
  - Guides:
      - Build & Install: build.md
      - REST API: api.md
      - Testing: testing.md
      - Deployment: deployment.md
      - Security: security.md
  - Reference:
      - Documentation Index: reference/README.md
      - Benchmarks: benchmarks.md
      - Roadmap: roadmap.md
      - Changelog: changelog.md
      - Philosophy: reference/philosophy.md
      - Architecture: reference/architecture.md
      - System Design: reference/system_design.md
      - Build & Install: reference/build.md
      - REST API: reference/api.md
      - Testing: reference/testing.md
      - Deployment: reference/deployment.md
      - Security: reference/security.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Mattral/KANX
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/kanx/
