name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev + api + torch + onnx extras
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev,api,onnx,hub]"
          # Torch CPU wheel from the dedicated index
          pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Lint (ruff)
        run: ruff check src tests api benchmarks examples

      - name: Format check (black)
        run: black --check src tests api benchmarks examples || true

      - name: Start API server
        run: |
          uvicorn api.app:app --port 8001 --host 0.0.0.0 &
          # give it a few seconds to boot
          sleep 5

      - name: Run tests with coverage
        env:
          TF_CPP_MIN_LOG_LEVEL: "3"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: pytest tests/ -v --tb=short --cov=src/kanx --cov-report=xml --cov-report=term

      - name: Upload coverage artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t kanx:ci .

      - name: Smoke-test container
        run: |
          docker run -d -p 8000:8000 --name kanx-ci kanx:ci
          # show logs immediately so we can see if uvicorn crashed
          sleep 5
          docker logs kanx-ci
          for i in {1..30}; do
            curl -fsS http://localhost:8000/api/health && break
            sleep 5
          done
          curl -fsS http://localhost:8000/api/info
          curl -fsS -X POST http://localhost:8000/api/predict \
              -H 'content-type: application/json' \
              -d '{"x": [[0.1, -0.2]]}'
          docker stop kanx-ci

  docs:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Build MkDocs site
        run: |
          pip install mkdocs mkdocs-material
          mkdocs build

  benchmark-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and California-housing loader
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,hub]"
          pip install scikit-learn

      - name: Smoke-test synthetic benchmark on CPU
        env:
          TF_CPP_MIN_LOG_LEVEL: "3"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: python benchmarks/compare_mlp.py --smoke --output "${{ runner.temp }}/compare.md"

      - name: Smoke-test real-world benchmark on CPU
        env:
          TF_CPP_MIN_LOG_LEVEL: "3"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: python benchmarks/real_world.py --smoke --output "${{ runner.temp }}/real_world.json"
